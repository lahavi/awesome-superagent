name: Links

on:
  push:
    branches: [main]
    paths: ['**.md', '.lycheeignore', '.github/workflows/links.yml']
  pull_request:
    paths: ['**.md', '.lycheeignore', '.github/workflows/links.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept '200..=299,429'
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
            './**/*.md'
          fail: ${{ github.event_name != 'schedule' }}

      - name: Find open broken-links issue
        id: existing
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list -R '${{ github.repository }}' --label broken-links --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      - name: Report broken links
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.existing.outputs.number }}
